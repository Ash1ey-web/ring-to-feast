const deployment = {"external":true,"apiOrigin":"https://ring-to-feast.caiwenhui11.chatgpt.site","siteUrl":"https://ash1ey-web.github.io/ring-to-feast/"}
const usePublishedSite = location.protocol === "file:" || deployment.external
const apiOrigin = usePublishedSite ? deployment.apiOrigin : location.origin
const app = document.querySelector("#app")
const dialog = document.querySelector("#dialog")
const dialogContent = document.querySelector("#dialog-content")
const toast = document.querySelector("#toast")
const storageKey = "ring-to-feast-seat"
const prefsKey = "ring-to-feast-preferences"
const inviteCode = new URLSearchParams(location.search).get("room")?.toUpperCase() ?? ""
const sounds = {
  click: new Audio(assets.clickSound),
  bell: new Audio(assets.bellSound)
}

function read(storage, key, fallback) {
  try { return JSON.parse(storage.getItem(key)) ?? fallback } catch { return fallback }
}

function write(storage, key, value) {
  try { storage.setItem(key, JSON.stringify(value)) } catch {}
}

let settings = read(localStorage, prefsKey, { sound: true, reduceMotion: matchMedia("(prefers-reduced-motion: reduce)").matches })
let session = read(sessionStorage, storageKey, null)
let solo = null
let screen = "splash"
let state = null
let lastState = ""
let pendingRequest = false
let requestGeneration = 0
let lastFeedId = 0
let bonusEntries = []
let bonusTimer
let marketLocalDeadline = null
let pollTimer
let toastTimer
let waitingNetwork = false
let playerName = ""
let roomNumber = inviteCode
let rulesReturn = "menu"
let settingsReturn = "menu"

const e = value => String(value ?? "").replace(/[&<>"']/g, character =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character])
const attrs = (action, value) => 'data-action="' + e(action) + '"' + (value === undefined ? "" : ' data-value="' + e(value) + '"')
const button = (label, action, value, style = "", disabled = false) =>
  '<button type="button" class="' + style + '" ' + attrs(action, value) + (disabled ? " disabled" : "") + ">" + e(label) + "</button>"
const img = (key, alt, style = "") => '<img class="' + style + '" src="' + assets[key] + '" alt="' + e(alt) + '" draggable="false">'
const status = (message, style = "muted") => '<p class="' + style + '">' + e(message) + "</p>"
const title = (heading, back, extra = "") =>
  '<header class="page-top"><h1>' + e(heading) + '</h1><div class="row">' + extra + button("Back", "screen", back, "plain") + "</div></header>"
const rank = seat => state.players[seat]?.name ?? "Chef"
const own = () => state.players[state.seat]
const myTurn = () => state.phase === "action" && state.turn === state.seat && !state.pending && !state.tradeOffer
const ingredientName = key => ingredients[key]?.[0] ?? key
const option = (value, text, disabled = false) => '<option value="' + e(value) + '"' + (disabled ? " disabled" : "") + ">" + e(text) + "</option>"
const select = (label, name, options) => '<label>' + e(label) + '<select name="' + e(name) +
  '" aria-label="' + e(label) + '" required>' + options + "</select></label>"

function notify(message) {
  toast.hidden = false
  toast.textContent = message
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { toast.hidden = true }, 3800)
}

function playSound(kind = "click") {
  if (!settings.sound) return
  const audio = sounds[kind]
  audio.currentTime = 0
  audio.play().catch(() => {})
}

function clearBonusNotices() {
  clearTimeout(bonusTimer)
  bonusEntries = []
  for (const notice of document.querySelectorAll("[data-bonus-notice]")) notice.remove()
}

function bonusNotice(inDialog = false) {
  if (!bonusEntries.length) return ""
  const lines = bonusEntries.map(({ seat, source, cards }) =>
    '<div class="bonus-line"><div class="bonus-cards">' +
    cards.map(card => img("i-" + card, "", "pixel")).join("") + "</div><div>" +
    status(rank(seat) + " / " + cards.map(ingredientName).join(", "), "bonus-recipient") +
    status(source, "fine muted") + "</div></div>").join("")
  return '<aside data-bonus-notice class="bonus-notice' + (inDialog ? " bonus-inline" : "") + '" role="status">' +
    status("Bonus Ingredient" + (bonusEntries.reduce((count, entry) => count + entry.cards.length, 0) > 1 ? "s" : ""), "eyebrow") +
    lines + "</aside>"
}

function setScreen(next) {
  if (dialog.open) dialog.close()
  screen = next
  render()
  if (next !== "board") window.scrollTo(0, 0)
}

function splash() {
  return '<section class="splash" aria-label="Ring to Feast!"><div class="splash-art">' +
    img("cover", "Ring to Feast!", "pixel") + '<p class="splash-prompt">Press any key to start</p></div></section>'
}

function menuScene(heading, controls) {
  return '<section class="shell menu-scene">' + img("background", "", "menu-art pixel") +
    '<div class="menu-box panel"><h1>' + e(heading) + "</h1>" + controls + "</div></section>"
}

function menu() {
  return menuScene("Ring to Feast!", button("Start Game", "screen", "modes", "primary") +
    button("View Rules", "rules", undefined, "secondary") +
    button("Settings", "settings", undefined, "plain"))
}

function modes() {
  return menuScene("Start Game", button("Online Mode", "online", undefined, "primary") +
    button("Local Mode", "local", undefined, "secondary") +
    button("Back", "screen", "menu", "plain"))
}

function roomEntry() {
  return '<section class="shell"><div class="lobby">' + title("Play Online", "modes") +
    '<div class="panel room-panel room-entry"><h2>Three chefs per room</h2>' +
    '<label>Chef name<input id="chef-name" maxlength="16" autocomplete="nickname" placeholder="Your chef name" value="' + e(playerName) + '"></label>' +
    '<div class="split"><section class="stack"><h3>Host a game</h3>' +
    button("Create Room", "create", undefined, "primary") +
    '</section><section><form id="join-form"><h3>Join a game</h3><label>Room code<input name="code" maxlength="7" autocomplete="off" autocapitalize="characters" placeholder="7-character code" value="' + e(roomNumber) + '" required></label><button class="secondary" type="submit" form="join-form">Join Room</button></form></section></div>' +
    (session ? button("Resume Room " + session.code, "resume", undefined, "plain") : "") + "</div></div></section>"
}

function lobby() {
  const seats = Array.from({ length: 3 }, (_, seat) => {
    const member = state.players[seat]
    const label = seat === 0 ? "Host" : "Chef " + (seat + 1)
    return '<div class="seat ' + (member ? "" : "empty") + '"><span class="eyebrow">' + label +
      (seat === state.seat ? " / You" : "") + '</span><span>' + e(member?.name ?? "Open seat") + "</span></div>"
  }).join("")
  return '<section class="shell"><div class="lobby">' + title("Game Room", "menu") +
    '<div class="panel room-panel"><div class="row"><div><p class="eyebrow">Room code</p><p class="room-code">' + e(state.code) +
    "</p></div>" + button("Copy Invite", "invite", undefined, "secondary") + '</div><div class="seats">' + seats + "</div>" +
    status(state.players.length === 3 ? (state.seat === 0 ? "All chefs are seated." : "Waiting for the host to start.") : "Waiting for " +
      (3 - state.players.length) + (state.players.length === 2 ? " more chef." : " more chefs.")) +
    '<div class="row">' + (state.seat === 0 ? button("Start Match", "play", "start", "primary", state.players.length !== 3) : "") +
    button("Leave Room", "leave", undefined, "plain") + "</div></div></div></section>"
}

function ruleBlock(block) {
  if (typeof block === "string") return "<p>" + e(block) + "</p>"
  const headers = block.headers.map(header => '<th scope="col">' + e(header) + "</th>").join("")
  const rows = block.rows.map(([key, ...cells], index) => {
    const swatch = block.colors ? '<span class="rule-swatch" data-color="' + e(block.colors[index]) + '" aria-hidden="true"></span>' : ""
    return '<tr><th scope="row">' + swatch + e(key) + "</th>" +
      cells.map(cell => "<td>" + e(cell) + "</td>").join("") + "</tr>"
  }).join("")
  return '<table class="rule-table" aria-label="' + e(block.label) + '"><thead><tr>' + headers +
    "</tr></thead><tbody>" + rows + "</tbody></table>"
}

function rulesPage() {
  const sections = assets.ruleSections.map(({ title, blocks }) =>
    '<section class="rule-section"><h2>' + e(title) + "</h2>" +
    blocks.map(ruleBlock).join("") + "</section>").join("")
  const video = e(assets.rulesVideo)
  return '<section class="shell rules">' + title("Rules Introduction", rulesReturn) +
    '<div class="panel rule-video"><video controls playsinline preload="metadata" aria-label="Rules Introduction video" src="' +
    video + '"></video><p class="fine video-error" hidden>Video unavailable. <a href="' + video +
    '" target="_blank" rel="noopener">Open the original video</a></p></div>' +
    '<article class="panel rule-text" lang="zh-Hans">' + sections + "</article></section>"
}

function settingsPage() {
  return '<section class="shell"><div class="lobby">' + title("Settings", settingsReturn) +
    '<section class="room-panel panel"><label class="row"><input type="checkbox" data-setting="sound"' + (settings.sound ? " checked" : "") +
    '>Sound effects</label><label class="row"><input type="checkbox" data-setting="reduceMotion"' +
    (settings.reduceMotion ? " checked" : "") + '>Reduce motion</label><details><summary>Credits</summary><p class="fine">' +
    '<a href="https://github.com/aseprite/aseprite/blob/main/data/fonts/LICENSE.txt" target="_blank" rel="noopener">Aseprite Font by David Capello, CC BY 4.0</a>' +
    '<br><a href="' + e(assets.soundCredit.url) + '" target="_blank" rel="noopener">' + e(assets.soundCredit.label) + '</a>' +
    '<br><a href="' + e(assets.bellCredit) + '" target="_blank" rel="noopener">Bell icon by Willosuna</a>' +
    '<br><a href="https://kicked-in-teeth.itch.io/dice-roll" target="_blank" rel="noopener">Dice Roll by Kicked-in-Teeth, CC BY-SA</a>' +
    "</p></details></section></div></section>"
}

const artCorrections = {
  "r-surf-turf": ["surf-title", "Surf and"],
  "c-fridge": ["fridge-line", "Each player"],
  "c-reverse": ["reverse-line", "may cancel"],
  "f-fire": ["fire-line", "1 ingredient"]
}

function cardArt(key, alt, style = "") {
  const correction = artCorrections[key]
  if (!correction) return img(key, alt, style)
  const [placement, label] = correction
  return '<span class="card-art ' + style + '">' + img(key, alt, "pixel") +
    '<span aria-hidden="true" class="card-text-fix ' + placement + '"><span>' + e(label) + "</span></span></span>"
}

function card(key, name, action, value, amount = 1) {
  const picture = cardArt(key, name)
  return '<figure class="card">' + (action ? '<button class="card-button" type="button" ' + attrs(action, value) +
    ' aria-label="' + e(name) + '">' + picture + "</button>" : picture) +
    '<figcaption>' + e(name) + (amount > 1 ? " x" + amount : "") + "</figcaption></figure>"
}

function grouped(hand) {
  return Object.entries(hand.reduce((counts, key) => {
    counts[key] = (counts[key] ?? 0) + 1
    return counts
  }, {}))
}

function ingredientCards(hand) {
  return grouped(hand).map(([key, count]) => card("i-" + key, ingredientName(key), "inspect", "i-" + key, count)).join("")
}

function chefHeader(chef, seat) {
  const mark = chef.name.slice(0, 1).toUpperCase()
  return '<div class="seat-title"><span class="chef-mark mark-' + seat + '" aria-hidden="true">' + e(mark) +
    '</span><div class="chef-details"><strong>' + e(chef.name) + (seat === state.seat ? " / You" : "") +
    '</strong><div class="stats"><span class="badge">' + chef.score + ' pts</span>' +
    (state.phase === "action" && (seat === state.turn || seat === state.seat) ? '<span class="badge coin">' + chef.ap + " AP</span>" : "") + "</div></div></div>"
}

function rival(seat, style = "") {
  const chef = state.players[seat]
  const backs = chef.recipeBacks.map((count, level) => count ?
    card("back-r" + level, "Level " + (level + 1), null, null, count) : "").join("")
  const showBacks = backs ? '<div class="cards compact">' + backs + "</div>" : ""
  return '<section class="panel seat-board ' + (state.phase === "action" && state.turn === seat ? "active " : "") + style +
    '">' + chefHeader(chef, seat) + '<div class="row">' + showBacks +
    '<div class="cards compact">' + (chef.hand.length ? ingredientCards(chef.hand) : '<p class="fine muted">No ingredients</p>') + "</div></div>" +
    (chef.cooked.length ? button("Plated dishes (" + chef.cooked.length + ")", "dishes", seat, "plain fine") : "") +
    "</section>"
}

function stackCard(key, label, caption, inspect) {
  return "<figure>" + (inspect ? '<button class="card-button" type="button" ' + attrs("inspect", inspect) + ' aria-label="' +
    e(label) + '">' + img(key, "") + "</button>" : img(key, label)) +
    "<figcaption>" + e(label) + (caption ? "<br>" + e(caption) : "") + "</figcaption></figure>"
}

function decks() {
  const current = chance[state.chance]
  return '<aside class="panel deck-area"><section class="stack"><h3>Recipe decks</h3><div class="decks">' +
    levels.map((level, index) => stackCard("back-r" + index, level, state.decks[index] + " left")).join("") +
    '</div></section><section class="stack"><h3>Supply decks</h3><div class="decks">' +
    stackCard("back-i", "Ingredients", state.pantryCount + " left") + stackCard("back-f", "Fate") + stackCard("back-c", "Chance") +
    '</div></section><section class="chance-box"><p class="eyebrow">Round ' + state.round + ' Event</p><h3>' + e(current[0]) + "</h3>" + status(current[2], "fine") +
    button("View Chance Card", "inspect", "c-" + state.chance, "plain") + "</section></aside>"
}

function ownArea() {
  const chef = own()
  const fates = ownFate()
  return '<section class="panel home ' + (myTurn() ? "active" : "") + '">' + chefHeader(chef, state.seat) +
    '<div class="tray"><h3>My ingredients (' + chef.hand.length + ')</h3><div class="cards">' + (ingredientCards(chef.hand) || status("No ingredients", "fine muted")) +
    '</div></div><div class="tray"><div class="tray-title"><h3>My recipes</h3>' +
    (chef.cooked.length ? button("Plated dishes (" + chef.cooked.length + ")", "dishes", state.seat, "plain fine") : "") +
    '</div><div class="cards">' + (grouped(chef.recipes).map(([key, count]) => card("r-" + key, recipes[key].name, "inspect", "r-" + key, count)).join("") || status("No recipes", "fine muted")) + "</div></div>" +
    (fates ? '<div class="tray"><h3>My Fate cards</h3><div class="tags">' + fates + "</div></div>" : "") + "</section>"
}

function ownFate() {
  return [state.own.fate.map(key => [key, "Next round"]), state.own.activeFate.map(key => [key, "This round"])]
    .flat().map(([key, label]) => button(fate[key][0] + " / " + label, "inspect", "f-" + key, "plain fine")).join("")
}

function market() {
  const count = state.market.filter(Boolean).length
  const cards = state.market.map((key, index) => {
    const taken = state.marketTaken[index]
    return '<figure class="market-slot' + (taken == null ? "" : " claimed") + '">' +
      img(key ? "i-" + key : "back-i", key ? ingredientName(key) : "Face-down ingredient") +
      '<figcaption>' + e(key ? ingredientName(key) : "Face down") +
      (taken == null ? "" : '<span class="claim-tag">' + e(rank(taken)) + "</span>") + "</figcaption></figure>"
  }).join("")
  return '<p class="eyebrow">Ingredient Market</p><div class="market-cards">' + cards +
    '</div><p class="table-copy fine">' + count + " / " + state.market.length + " revealed" +
    (state.canRing ? " / Ring to claim" : count < state.market.length ? " / Waiting for the next card" : "") +
    (state.marketClosesAt ? '<span class="market-close" data-market-clock></span>' : "") +
    '</p><div><button type="button" class="bell" data-action="play" data-value="ring"' + (state.canRing ? "" : " disabled") + '>' +
    img("bell", "", "pixel") + "Ring Bell</button></div>";
}

function prep() {
  const data = state.own
  if (state.phase === "fate-choice") return '<h2>Fate Reversal</h2>' + (data.cancel
    ? status("You may cancel one Fate card due this round.") + button("Choose Fate Card", "choose", "cancel", "secondary")
    : status("Waiting for the other chefs to choose."));
  return '<h2>Round Setup</h2>' + (data.discard || data.lucky ?
    (data.discard ? status("Choose " + data.discard + " ingredient" + (data.discard > 1 ? "s" : "") + " to discard.") +
      button("Discard Ingredient", "choose", "discard", "primary") : "") +
    (data.lucky ? status("Choose one ingredient from the pantry.") + button("Choose Ingredient", "choose", "lucky", "secondary") : "")
    : status("Waiting for the other chefs to finish setup."));
}

const moveNames = { rock: "Rock", paper: "Paper", scissors: "Scissors" }

function duelDisplay(duel, result = null) {
  const players = [duel.seat, duel.target]
  return '<div class="duel-faces">' + players.map((seat, index) => {
    const move = result && (index === 0 ? result.first : result.second)
    const detail = move ? status(moveNames[move], "duel-choice") : status(duel.throws?.[seat] ? "Locked in" : "Choosing", "muted fine")
    const won = result?.winner === seat
    const wins = duel.wins[seat] || 0
    return '<div class="duel-face' + (won ? " won" : "") + '"><p>' + e(rank(seat)) +
      '</p><div class="duel-move">' + detail + '</div><p class="fine">' + wins + (wins === 1 ? " win" : " wins") + "</p></div>"
  }).join('<span class="duel-vs" aria-hidden="true">VS</span>') + "</div>"
}

function duelHistory(duel) {
  if (!duel.history.length) return ""
  return '<ol class="duel-history" aria-label="Throws so far">' + duel.history.map((result, index) =>
    '<li><span>Throw ' + (index + 1) + '</span><span>' + e(rank(duel.seat)) + " / " + moveNames[result.first] +
    '</span><span>' + e(rank(duel.target)) + " / " + moveNames[result.second] +
    '</span><strong>' + (result.winner == null ? "Tie" : e(rank(result.winner)) + " wins") + "</strong></li>").join("") + "</ol>"
}

function diceGraphic(face, rolling) {
  const x = face ? (face - 1) * -64 : 0
  const y = rolling ? -896 : 0
  return '<span class="dice-sprite' + (rolling ? " dice-rolling" : "") + '" aria-hidden="true" style="--dice-sheet:url(' +
    assets.dice + ');--face-x:' + x + 'px;--face-y:' + y + 'px"></span>'
}

function cookingView(cook) {
  const face = cook.rolls.flat().at(-1)
  const name = rank(cook.seat)
  const reason = cook.rollReason
  const helper = {
    first: name + " is ready to roll.",
    six: "A 6 requires another roll.",
    fate: "Heat Master requires another roll."
  }[reason]
  const message = cook.rolling ? name + " is rolling..." : face ? name + " rolled " + face + "." : helper
  const history = cook.rolls.filter(series => series.length).map(series => series.join(", ")).join(" / ")
  const heat = cook.heatResult
  const adjustment = heat && heat.adjusted !== face ? " / Adjusted to " + heat.adjusted : ""
  const heatText = heat ? heat.heatName + " / " + (heat.heatScore >= 0 ? "+" : "") + heat.heatScore + " pts" + adjustment : ""
  const mayAct = cook.seat === state.seat && !cook.rolling
  let actions = ""
  if (mayAct && reason) actions = button(reason === "first" ? "Roll Dice" : "Roll Again", "play", "roll-dice", "primary")
  if (mayAct && heat) actions = (state.own.reroll && !cook.optional ? button("Reroll", "play", "reroll", "secondary") : "") +
    button("Plate Dish", "play", "plate", "primary")
  return '<section class="cook-dice stack" aria-label="Cooking dice"><h2>' + e(recipes[cook.recipe].name) +
    '</h2><div class="dice-tray">' + (face || cook.rolling ? diceGraphic(face, cook.rolling) : "") + '</div><div role="status" class="stack">' +
    status(message) + (face && !cook.rolling && helper ? status(helper, "fine") : "") +
    (heatText ? status(heatText, "dice-result") : "") +
    (history ? status("Rolls: " + history, "fine muted") : "") + '</div>' +
    (actions ? '<div class="turn-actions">' + actions + "</div>" : "") + "</section>"
}

function pendingAction(action) {
  if (action.kind === "cook") return cookingView(action)
  const name = rank(action.seat) + " / " + rank(action.target)
  if (action.kind === "trade") {
    const response = action.target === state.seat
      ? button("Accept", "answer", "yes", "primary") + button("Decline", "answer", "no", "plain")
      : action.seat === state.seat ? button("Withdraw Offer", "play", "trade-withdraw", "plain") : ""
    return "<h2>Trade Offer</h2>" + status(rank(action.seat) + " offers " + (action.giveCount ?? 1) + " x " +
      ingredientName(action.give) + " for " + (action.wantCount ?? 1) + " x " + ingredientName(action.want) + ".") +
      (action.target === state.seat ? "" : status("Waiting for " + rank(action.target) + ".", "fine")) +
      (response ? '<div class="turn-actions">' + response + "</div>" : "")
  }
  if (action.stage === "invite") return "<h2>Cooking Duel</h2>" + status(name) +
    (action.target === state.seat ? '<div class="turn-actions">' + button("Accept Duel", "answer", "yes", "primary") +
      button("Decline Duel", "answer", "no", "plain", !own().hand.length) + "</div>" +
      (!own().hand.length ? status("You need an ingredient to decline.", "fine") : "") : status("Waiting for " + rank(action.target) + ".", "fine"))
  const duelist = action.seat === state.seat || action.target === state.seat
  const last = action.history.at(-1)
  const history = duelHistory(action)
  if (action.stage === "reward") return "<h2>" + e(rank(action.winner)) + " wins the duel</h2>" + duelDisplay(action, last) +
    (state.seat === action.winner ? button("Choose Reward", "choose", "reward", "primary") : status("Waiting for the winner to choose a reward.")) + history
  if (action.stage === "reveal") {
    const headline = last.winner === null ? "Tie / Replay the Throw" : rank(last.winner) + " wins this throw"
    const canContinue = duelist && !action.reviewed.includes(state.seat)
    return "<h2>" + e(headline) + "</h2>" + duelDisplay(action, last) +
      (canContinue ? button("Next Throw", "play", "duel-next", "primary") : status("Waiting for the duelists to continue.", "fine")) + history
  }
  const canThrow = duelist && !action.throws[state.seat]
  return "<h2>Rock Paper Scissors</h2>" + status("Throw " + (action.history.length + 1) + " / First to 2 wins", "fine") +
    duelDisplay(action) + (canThrow ? '<div class="turn-actions duel-actions">' + Object.entries(moveNames).map(([move, label]) =>
      button(label, "move", move, "secondary")).join("") +
      "</div>" : status(duelist ? "Your move is locked in." : "Watching the duel.", "fine")) + history
}

function tradeButton() {
  const canTrade = state.own.canTrade && own().hand.length && targets(true).length
  return button("Trade", "choose", "trade", "secondary", !canTrade)
}

function table() {
  const over = state.overflow.flatMap((count, seat) => count ? [rank(seat)] : [])
  if (over.length && (state.phase !== "market" || state.overflow[state.seat])) {
    return "<h2>Ingredient Hand Limit</h2>" + status("Waiting for " + over.join(", ") + " to discard extra ingredients.")
  }
  if (over.length) return market() + status("Market paused while " + over.join(", ") + " discards.", "fine")
  if (state.phase === "market") return market()
  if (state.phase === "fate-choice" || state.phase === "prep") return prep()
  if (state.phase === "finished") return '<p class="eyebrow">Final standings</p><h2>' + e(rank(state.ranking[0])) +
    ' wins!</h2><div class="rankings">' + state.ranking.map((seat, place) =>
      "<p><span>" + (place + 1) + ". " + e(rank(seat)) + "</span><span>" + state.players[seat].score + " pts</span></p>").join("") +
    '</div><div class="row" style="justify-content:center">' + button("Return to Menu", solo ? "local-exit" : "screen", "menu", "primary") + "</div>"
  if (state.tradeOffer) return pendingAction(state.tradeOffer)
  if (state.pending) return pendingAction(state.pending)
  const chef = own()
  const claims = state.marketClaims.map(claim => claim.name + " claimed " + claim.count).join(" / ")
  const claim = claims ? status(claims, "fine muted") : ""
  if (!myTurn()) return "<h2>Free Actions</h2>" + status(rank(state.turn) + " is taking their turn.") + claim
  return '<h2>Your Free Actions</h2>' + status(chef.ap + " action point" + (chef.ap === 1 ? "" : "s") + " remaining.") + claim +
    '<div class="turn-actions">' + button("Draw Ingredient", "play", "draw-ingredient", "secondary", !chef.ap || !state.pantryCount) +
    button("Cook", "choose", "cook", "primary", !chef.ap || !chef.recipes.length) +
    button("Draw Recipe", "choose", "recipe", "", !chef.ap || !state.decks.slice(0, state.own.unlock + 1).some(Boolean)) +
    button("Duel", "choose", "duel", "plain", !chef.ap || !chef.hand.length) +
    tradeButton() +
    button("End Turn", "play", "end", "plain") + "</div>"
}

function board() {
  const north = (state.seat + 1) % 3
  const east = (state.seat + 2) % 3
  const phase = { market: "Market", action: "Free Actions", "fate-choice": "Fate Reversal", prep: "Setup", finished: "Finished" }[state.phase]
  const feed = state.feed.slice(-10).reverse().map(item => "<li>" + e(item.text) + "</li>").join("")
  return '<section class="board-shell"><header class="board-bar"><div class="row"><strong>Ring to Feast!</strong><span class="tag">' + (solo ? "Local Mode" : "Room ") +
    (solo ? "" : e(state.code)) + '</span><span class="tag">Round ' + state.round + "/" + state.maxRounds + '</span><span class="tag">' + e(phase) +
    '</span><span class="tag" data-network hidden>Reconnecting</span></div><div class="row">' + button("Rules", "rules", undefined, "plain fine") +
    button("Settings", "settings", undefined, "plain fine") +
    (state.lastDuel ? button("Last Duel", "duel-history", undefined, "plain fine") : "") + "</div></header>" +
    (solo ? localToolbar() : "") + bonusNotice() +
    '<div class="board">' + decks() + rival(north, "north") + '<section class="table panel">' + table() + "</section>" + ownArea() +
    '<div class="east">' + rival(east) + '<section class="activity panel"><h3>Table log</h3><ol class="feed">' + feed + "</ol></section></div></div></section>"
}

function render() {
  const focus = document.activeElement
  const inApp = focus && app.contains(focus)
  const key = inApp ? [focus.dataset.action, focus.dataset.value] : null
  app.innerHTML = { splash, menu, modes, entry: roomEntry, lobby, rules: rulesPage, settings: settingsPage, board }[screen]()
  if (key?.[0]) {
    Array.from(app.querySelectorAll("[data-action]")).find(element =>
      element.dataset.action === key[0] && element.dataset.value === key[1] && !element.disabled)?.focus({ preventScroll: true })
  }
  document.body.classList.toggle("reduce-motion", settings.reduceMotion)
  updateClock()
  syncLimitDialog()
}

function updateClock() {
  const indicator = app.querySelector("[data-network]")
  if (indicator) indicator.hidden = !waitingNetwork || !!solo
  const marketClock = app.querySelector("[data-market-clock]")
  if (marketClock && marketLocalDeadline != null) {
    const left = Math.max(0, Math.ceil((marketLocalDeadline - Date.now()) / 1000))
    const label = " / Market closes in " + left + "s"
    if (marketClock.textContent !== label) marketClock.textContent = label
  }
}

function openDialog(heading, markup, requiredKey = "") {
  dialog.dataset.required = requiredKey
  dialogContent.innerHTML = '<header class="dialog-head"><h2 id="dialog-title">' + e(heading) + "</h2>" +
    (requiredKey ? "" : button("Close", "close", undefined, "plain")) + "</header>" + markup
  if (!dialog.open) dialog.showModal()
}

function updateLimitSelection(formElement) {
  const boxes = [...formElement.querySelectorAll('input[name="card"]')]
  const required = Number(formElement.dataset.limitCount)
  const selected = boxes.filter(box => box.checked).length
  for (const box of boxes) box.disabled = !box.checked && selected >= required
  formElement.querySelector("[data-selected]").textContent = selected + " / " + required + " selected"
  formElement.querySelector('button[type="submit"]').disabled = selected !== required
}

function syncLimitDialog() {
  const excess = screen === "board" ? state.overflow[state.seat] : 0
  if (!excess) {
    if (dialog.dataset.required && dialog.open) dialog.close()
    dialog.dataset.required = ""
    return
  }
  const hand = own().hand
  const key = state.seat + "/" + hand.join(",")
  if (dialog.open && dialog.dataset.required === key) return
  const cards = hand.map(id => '<label class="discard-choice"><input type="checkbox" name="card" value="' + e(id) +
    '"><span class="stack">' + img("i-" + id, "", "pixel") + '<span>' + e(ingredientName(id)) + "</span></span></label>").join("")
  openDialog("Discard Extra Ingredients", bonusNotice(true) + '<form class="stack" data-form="discard-overflow" data-limit-count="' + excess + '">' +
    status("You have " + hand.length + " ingredients. Choose exactly " + excess + " to discard.") +
    '<div class="discard-grid">' + cards + '</div><p class="fine" aria-live="polite" data-selected></p>' +
    '<button type="submit" class="primary" disabled>Confirm Discard</button></form>', key)
  updateLimitSelection(dialog.querySelector("form"))
}

dialog.addEventListener("cancel", event => { if (dialog.dataset.required) event.preventDefault() })

function inspect(key) {
  const id = key.slice(2)
  if (key.startsWith("i-")) return openDialog(ingredientName(id), img(key, ingredientName(id), "detail-image pixel"))
  if (key.startsWith("r-")) {
    const entry = recipes[id]
    return openDialog(entry.name, '<div class="stack">' + cardArt(key, entry.name, "detail-image pixel") +
      status(levels[entry.level] + " recipe", "eyebrow") + status(entry.needed.map(ingredientName).join(" + ")) + "</div>")
  }
  const entry = key.startsWith("c-") ? chance[id] : fate[id]
  if (entry) openDialog(entry[0], '<div class="stack">' + cardArt(key, entry[0], "detail-image pixel") + status(entry[2]) + "</div>")
}

function dishes(seat) {
  openDialog(rank(seat) + " / Plated dishes", '<div class="stack">' + state.players[seat].cooked.map(dish =>
    '<section class="seat"><h3>' + e(recipes[dish.recipe].name) + " / " + dish.score + " pts</h3>" +
    status("Roll " + dish.rolls.at(-1).at(-1) + " / " + dish.heat + " (" + (dish.heatScore >= 0 ? "+" : "") + dish.heatScore + ")",
      "fine") + (dish.extra ? status("Extra " + ingredientName(dish.extra) + " +1", "fine") : "") +
    (dish.blaze ? status("Blazing Cook +" + dish.blaze, "fine") : "") +
    (dish.penalty ? status("Culinary Taunt -" + dish.penalty, "fine") : "") + "</section>").join("") + "</div>")
}

function targets(needsIngredients = false) {
  return state.players.map((member, seat) => ({ member, seat })).filter(({ member, seat }) =>
    seat !== state.seat && (!needsIngredients || member.hand.length))
}

function ingredientOptions(hand, showCounts = true) {
  return grouped(hand).map(([key, amount]) => option(key, ingredientName(key) + (showCounts && amount > 1 ? " x" + amount : ""))).join("")
}

function tradeIngredient(label, name, hand, quantityLabel) {
  const options = ingredientOptions(hand, false)
  const max = ingredientCount(hand, hand[0])
  return '<div class="trade-item">' + select(label, name, options) + '<div class="trade-stepper">' +
    '<input type="number" name="' + name + 'Count" aria-label="' + quantityLabel +
    '" min="1" max="' + max + '" step="1" value="1" required>' +
    '<button type="button" data-step="up" aria-label="Increase ' + quantityLabel.toLowerCase() + '"' +
    (max <= 1 ? " disabled" : "") + '>▲</button>' +
    '<button type="button" data-step="down" aria-label="Decrease ' + quantityLabel.toLowerCase() + '" disabled>▼</button></div></div>'
}

function refreshTradeStepper(input) {
  const { valueAsNumber, max } = input
  input.parentElement.querySelector('[data-step="up"]').disabled = valueAsNumber >= Number(max) || Number(max) <= 1
  input.parentElement.querySelector('[data-step="down"]').disabled = !(valueAsNumber > 1)
}

function resetTradeQuantity(formElement, name, hand) {
  const input = formElement.elements[name + "Count"]
  input.max = ingredientCount(hand, formElement.elements[name].value)
  input.value = "1"
  refreshTradeStepper(input)
}

function form(type, markup, label) {
  return '<form class="stack" data-form="' + type + '">' + markup + '<button type="submit" class="primary">' + e(label) + "</button></form>"
}

function cookingSelection(recipe) {
  const hand = [...own().hand]
  const missing = recipes[recipe].needed.filter(key => {
    const found = hand.indexOf(key)
    if (found === -1) return true
    hand.splice(found, 1)
    return false
  })
  return { missing, extras: [...new Set(hand.filter(key => seasonings.includes(key)))] }
}

function updateRecipeForm() {
  const formElement = dialog.querySelector('[data-form="cook"]')
  if (!formElement) return
  const recipe = formElement.elements.recipe.value
  const { missing, extras } = cookingSelection(recipe)
  formElement.querySelector("[data-ingredients]").textContent = missing.length ? "Missing: " + missing.map(ingredientName).join(", ") :
    "Required: " + recipes[recipe].needed.map(ingredientName).join(", ")
  formElement.elements.extra.innerHTML = option("", "None") + extras.map(key => option(key, ingredientName(key) + " (+1)")).join("")
  formElement.querySelector('button[type="submit"]').disabled = !!missing.length
}

function choose(type) {
  if (type === "cook") {
    const available = own().recipes.toSorted((a, b) => cookingSelection(a).missing.length - cookingSelection(b).missing.length)
    openDialog("Cook a Dish", form(type, select("Recipe", "recipe", available.map(key => option(key, recipes[key].name)).join("")) +
      '<p class="fine" data-ingredients></p>' + select("Extra seasoning", "extra", "").replace(" required", ""), "Cook / 1 AP"))
    return updateRecipeForm()
  }
  if (type === "recipe") return openDialog("Draw a Recipe", form("draw-recipe", select("Recipe tier", "level", levels.map((tier, index) =>
    option(index, tier + (index > state.own.unlock ? " / Locked" : !state.decks[index] ? " / Empty" : ""), index > state.own.unlock || !state.decks[index])).join("")), "Draw / 1 AP"))
  if (type === "duel") return openDialog("Challenge a Chef", form(type,
    select("Opponent", "target", targets().map(({member, seat}) => option(seat, member.name)).join("")) +
    select("Ingredient to pay", "card", ingredientOptions(own().hand)), "Challenge / 1 AP"))
  if (type === "trade") {
    const others = targets(true)
    openDialog("Offer a Trade", form(type, status(state.own.freeTrade ? "This offer uses your free trade." : "Sending an offer costs 1 action point.", "fine") +
      select("Chef", "target", others.map(({member, seat}) => option(seat, member.name)).join("")) +
      tradeIngredient("You give", "give", own().hand, "Give quantity") +
      tradeIngredient("You receive", "want", others[0].member.hand, "Receive quantity"), "Send Offer"))
    return
  }
  if (type === "reward") {
    const loser = state.players[state.pending.loser]
    return openDialog("Choose Duel Reward", '<div class="stack">' +
      (loser.hand.length ? form("steal", select("Steal a Bite", "card", ingredientOptions(loser.hand)), "Take Ingredient") : "") +
      button("Claim the Stove / Reroll next dish", "reward", "reroll", "secondary") +
      button("Culinary Taunt / Opponent dish -1", "reward", "taunt", "plain") + "</div>")
  }
  if (type === "cancel") return openDialog("Fate Reversal", form(type, select("Fate card", "index", option("", "Keep all effects") +
    state.own.activeFate.map((key, index) => option(index, fate[key][0] + " / " + fate[key][2])).join("")).replace(" required", ""), "Confirm"))
  if (type === "discard") return openDialog("Discard Ingredient", form(type, select("Ingredient", "card", ingredientOptions(own().hand)), "Discard"))
  if (type === "lucky") return openDialog("Lucky Ingredient", form(type, select("Ingredient", "card", ingredientOptions(state.pantryChoices)), "Take Ingredient"))
}

async function request(path, payload, token = session?.token) {
  const headers = {}
  if (token) headers.Authorization = "Bearer " + token
  if (payload !== undefined) headers["Content-Type"] = "application/json"
  const result = await fetch(apiOrigin + "/api/rooms" + path, {
    method: payload === undefined ? "GET" : "POST",
    headers,
    body: payload === undefined ? undefined : JSON.stringify(payload),
    cache: "no-store",
    signal: AbortSignal.timeout(8000)
  })
  const data = await result.json().catch(() => ({}))
  if (!result.ok) throw Object.assign(new Error(data.error ?? "Could not connect to the room service."), { status: result.status })
  return data
}

function acceptState(view) {
  waitingNetwork = false
  const { serverTime, ...comparable } = view
  const snapshot = JSON.stringify(comparable)
  if (view.marketClosesAt == null) marketLocalDeadline = null
  else if (state?.marketClosesAt !== view.marketClosesAt || marketLocalDeadline == null)
    marketLocalDeadline = Date.now() + Math.max(0, view.marketClosesAt - serverTime)
  state = view
  const freshEvents = lastFeedId ? view.feed.filter(event => event.id > lastFeedId) :
    solo ? view.feed.filter(event => event.bonus) : []
  const freshBonuses = freshEvents.flatMap(event => event.bonus ? [event.bonus] : [])
  const myBonuses = freshBonuses.filter(bonus => bonus.seat === view.seat)
  if (myBonuses.length || (freshBonuses.length && !bonusEntries.some(bonus => bonus.seat === view.seat))) {
    clearTimeout(bonusTimer)
    bonusEntries = myBonuses.length ? myBonuses : freshBonuses
    bonusTimer = setTimeout(clearBonusNotices, 5000)
  }
  const recent = view.feed.at(-1)
  if (recent) lastFeedId = recent.id
  if (screen === "lobby" && view.phase !== "lobby") {
    lastState = snapshot
    setScreen("board")
  } else if (snapshot !== lastState && (screen === "lobby" || screen === "board")) {
    lastState = snapshot
    render()
  } else updateClock()
}

function clearSeat() {
  clearTimeout(pollTimer)
  session = null
  state = null
  lastState = ""
  lastFeedId = 0
  clearBonusNotices()
  write(sessionStorage, storageKey, null)
}

function schedulePoll(delay = 750) {
  clearTimeout(pollTimer)
  if (session && !solo) pollTimer = setTimeout(poll, delay)
}

async function poll() {
  const current = session
  const generation = requestGeneration
  if (!current || pendingRequest || solo) return schedulePoll()
  try {
    const data = await request("/" + current.code)
    if (session === current && generation === requestGeneration) acceptState(data.view)
  } catch (error) {
    if (session !== current || generation !== requestGeneration) return
    if (error.status === 403 || error.status === 404) {
      clearSeat()
      setScreen("entry")
      notify(error.message)
      return
    }
    waitingNetwork = true
    updateClock()
  }
  schedulePoll(state?.pending?.rolling ? 240 : state?.phase === "market" ? 320 : 830)
}

function visibleError(error) {
  return error instanceof TypeError || error.name === "TimeoutError" ? "Could not reach the room service. Please retry." : error.message
}

async function withRequest(action) {
  if (pendingRequest) return
  pendingRequest = true
  requestGeneration++
  try { await action() } catch (error) { notify(visibleError(error)) }
  finally {
    pendingRequest = false
    schedulePoll(120)
  }
}

function connect(code) {
  playerName = document.querySelector("#chef-name")?.value.trim() ?? playerName
  if (!/^[A-Za-z0-9][A-Za-z0-9 _'-]{0,15}$/.test(playerName)) {
    notify("Enter a chef name using 1-16 English letters, numbers or spaces.")
    document.querySelector("#chef-name")?.focus()
    return
  }
  if (code && !/^[2-9A-HJ-NP-Z]{7}$/.test(code)) return notify("Enter a valid 7-character room code.")
  return withRequest(async () => {
    const data = await request(code ? "/" + code + "/join" : "", { name: playerName }, null)
    session = { code: data.view.code, token: data.token }
    write(sessionStorage, storageKey, session)
    lastFeedId = 0
    clearBonusNotices()
    acceptState(data.view)
    setScreen("lobby")
  })
}

function send(type, payload = {}) {
  if (type === "ring" && !pendingRequest) playSound("bell")
  if (solo) {
    const candidate = structuredClone(solo.game)
    const now = Date.now()
    try {
      advanceClock(candidate, now)
      perform(candidate, solo.seat, { ...payload, type, round: state.round }, now)
      solo.game = candidate
      if (dialog.open) dialog.close()
      acceptState(publicView(candidate, solo.seat, now))
    } catch (error) { notify(error.message) }
    return
  }
  return withRequest(async () => {
    const response = await request("/" + session.code + "/action", { ...payload, type, round: state.round })
    if (dialog.open) dialog.close()
    acceptState(response.view)
  })
}

function resume() {
  if (!session) return setScreen("entry")
  return withRequest(async () => {
    try {
      const response = await request("/" + session.code)
      acceptState(response.view)
      setScreen(response.view.phase === "lobby" ? "lobby" : "board")
    } catch (error) {
      if (error.status === 403 || error.status === 404) {
        clearSeat()
        setScreen("entry")
      }
      throw error
    }
  })
}

function invite() {
  const url = new URL(usePublishedSite ? deployment.siteUrl : location.href)
  url.search = ""
  url.hash = ""
  url.searchParams.set("room", state.code)
  navigator.clipboard?.writeText(url.href).then(() => notify("Invite link copied."), () => openInvite(url.href))
  if (!navigator.clipboard) openInvite(url.href)
}

function openInvite(url) {
  openDialog("Invite a Chef", '<label>Invite link<input readonly value="' + e(url) + '"></label>')
  dialog.querySelector("input").select()
}

function enter() {
  playSound()
  setScreen("menu")
}

document.addEventListener("click", event => {
  if (screen === "splash") return enter()
  const pressed = event.target.closest("button:not(:disabled), summary")
  if (pressed && !(pressed.dataset.action === "play" && pressed.dataset.value === "ring")) playSound()
  const step = event.target.closest(".trade-stepper [data-step]")
  if (step && !step.disabled) {
    const input = step.parentElement.querySelector("input")
    if (step.dataset.step === "up") input.stepUp()
    else input.stepDown()
    refreshTradeStepper(input)
    return
  }
  const control = event.target.closest("[data-action]")
  if (!control || control.disabled) return
  const { action, value } = control.dataset
  switch (action) {
    case "screen": return setScreen(value)
    case "online": return session && (!inviteCode || inviteCode === session.code) ? resume() : setScreen("entry")
    case "local": return startLocal()
    case "local-seat": return selectLocalSeat(Number(value))
    case "local-exit": return exitLocal()
    case "duel-history": return openDialog("Last Duel", '<div class="stack">' +
      duelDisplay(state.lastDuel, state.lastDuel.history.at(-1)) + duelHistory(state.lastDuel) + "</div>")
    case "resume": return resume()
    case "create": return connect("")
    case "invite": return invite()
    case "rules": rulesReturn = screen; return setScreen("rules")
    case "settings": settingsReturn = screen; return setScreen("settings")
    case "close": return dialog.close()
    case "inspect": return inspect(value)
    case "dishes": return dishes(Number(value))
    case "choose": return choose(value)
    case "play": return send(value)
    case "answer": return send((state.tradeOffer ?? state.pending).kind + "-answer", { accept: value === "yes" })
    case "move": return send("duel-move", { move: value })
    case "reward": return send("duel-reward", { reward: value })
    case "leave": return withRequest(async () => {
      await request("/" + session.code + "/leave", {})
      clearSeat()
      setScreen("entry")
    })
  }
})

document.addEventListener("error", ({ target }) => {
  if (target.matches?.(".rule-video video")) target.nextElementSibling.hidden = false
}, true)

document.addEventListener("submit", event => {
  const element = event.target
  if (element.id === "join-form") {
    event.preventDefault()
    roomNumber = element.elements.code.value.trim().toUpperCase()
    if (roomNumber) connect(roomNumber)
    return
  }
  const type = element.dataset.form
  if (!type) return
  event.preventDefault()
  const fields = new FormData(element)
  if (type === "discard-overflow") return send(type, { cards: fields.getAll("card") })
  const data = Object.fromEntries(fields)
  if ("target" in data) data.target = Number(data.target)
  if ("level" in data) data.level = Number(data.level)
  if ("index" in data) data.index = data.index === "" ? null : Number(data.index)
  if (type === "trade") {
    data.giveCount = Number(data.giveCount)
    data.wantCount = Number(data.wantCount)
  }
  if (type === "steal") send("duel-reward", { reward: "steal", card: data.card })
  else send(type, data)
})

document.addEventListener("change", event => {
  const { target } = event
  if (target.dataset.setting) {
    settings[target.dataset.setting] = target.checked
    write(localStorage, prefsKey, settings)
    document.body.classList.toggle("reduce-motion", settings.reduceMotion)
    if (target.dataset.setting === "sound") {
      if (target.checked) playSound()
      else for (const audio of Object.values(sounds)) audio.pause()
    }
  }
  if (target.form?.dataset.form === "cook" && target.name === "recipe") updateRecipeForm()
  if (target.form?.dataset.form === "discard-overflow") updateLimitSelection(target.form)
  if (target.form?.dataset.form === "trade") {
    const formElement = target.form
    if (target.name === "give") resetTradeQuantity(formElement, "give", own().hand)
    if (target.name === "target" || target.name === "want") {
      const hand = state.players[Number(formElement.elements.target.value)].hand
      if (target.name === "target") formElement.elements.want.innerHTML = ingredientOptions(hand, false)
      resetTradeQuantity(formElement, "want", hand)
    }
  }
})

document.addEventListener("input", ({ target }) => {
  if (target.closest(".trade-stepper")) refreshTradeStepper(target)
})

document.addEventListener("keydown", event => {
  if (screen === "splash") {
    event.preventDefault()
    enter()
  } else if (screen === "board" && state?.phase === "market" && !dialog.open && event.code === "Space" &&
      !event.repeat && !event.target.closest("button, input, select, a, summary") && state.canRing) {
    event.preventDefault()
    send("ring")
  }
})

function localToolbar() {
  return '<section class="local-toolbar row" aria-label="Local mode controls"><span class="fine">Play as</span>' +
    state.players.map((chef, seat) => '<button type="button" class="' + (seat === solo.seat ? "primary" : "plain") + " fine" +
      '" aria-pressed="' + (seat === solo.seat) + '" ' + attrs("local-seat", seat) + ">" + e(chef.name) + "</button>").join("") +
    button("Exit Local Mode", "local-exit", undefined, "plain fine") + "</section>"
}

function startLocal() {
  if (pendingRequest) return notify("Wait for the room request to finish.")
  const now = Date.now()
  const game = room("LOCAL", player("Chef 1"))
  game.players.push(player("Chef 2"), player("Chef 3"))
  start(game, now)
  requestGeneration++
  clearTimeout(pollTimer)
  solo = { game, seat: 0 }
  lastState = ""
  lastFeedId = 0
  clearBonusNotices()
  acceptState(publicView(solo.game, 0, now))
  setScreen("board")
}

function selectLocalSeat(seat) {
  solo.seat = seat
  if (dialog.open) dialog.close()
  acceptState(publicView(solo.game, seat, Date.now()))
}

function exitLocal() {
  solo = null
  state = null
  lastState = ""
  lastFeedId = 0
  clearBonusNotices()
  setScreen("modes")
}

setInterval(() => {
  updateClock()
  if (!solo || screen !== "board" || (solo.game.phase !== "market" && !solo.game.pending?.motion)) return
  const now = Date.now()
  advanceClock(solo.game, now)
  acceptState(publicView(solo.game, solo.seat, now))
}, 150)
render()
</script>
</body>
</html>
