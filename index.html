:root{color-scheme:light;--ink:#5e1714;--wine:#751916;--paper:#fff8e7;--cream:#fff0c8;--table:#fbd996;--gold:#ffcb70;--pink:#ff9deb;--aqua:#a6edf5;--mint:#b8f299;--lav:#d9b4f6;--line:#a45536;--shadow:5px 5px 0 var(--ink);font-family:Aseprite,"Courier New",monospace;font-size:var(--font-base,20px);line-height:1.32;color:var(--ink);background:#fffdf9}
*,::before,::after{box-sizing:border-box}
body{margin:0;min-height:100vh}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button,.button{background:var(--gold);border:3px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--ink);padding:.42rem .65rem;min-height:42px;color:var(--ink);cursor:pointer;text-align:center;text-decoration:none;line-height:1.16;display:inline-flex;justify-content:center;align-items:center;gap:.3rem;touch-action:manipulation;transition:background-color 80ms,transform 80ms,box-shadow 80ms}
button:hover:not(:disabled),.button:hover{background:#fff0a1;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active:not(:disabled),.button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{cursor:default;opacity:.48;box-shadow:none}
:focus-visible{outline:3px dashed var(--wine);outline-offset:4px}
input,select{max-width:100%;min-width:0;background:#fffdf7;border:2px solid var(--line);padding:.4rem .55rem;min-height:42px;border-radius:0}
label{display:grid;gap:.26rem}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:normal;line-height:1.1}
h1{font-size:2.05rem} h2{font-size:1.35rem} h3{font-size:.93rem}
img{max-width:100%;display:block}
.pixel{image-rendering:pixelated}
.muted{color:#74432d}
.fine{font-size:.73rem}
.eyebrow{text-transform:uppercase;letter-spacing:.055em;font-size:.66rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:.6rem}
.primary{background:var(--pink)}
.secondary{background:var(--aqua)}
.plain{background:var(--paper)}
.shell{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:clamp(16px,4vh,54px) 0 32px}
.splash{min-height:100svh;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.splash-art{position:relative;width:min(100%,173.9svh);container-type:inline-size}
.splash-art img{width:100%;height:auto}
.splash-prompt{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);font-family:Aseprite,"Courier New",monospace;font-size:clamp(.7rem,3.4cqi,2.6rem);color:#fff;text-shadow:0 2px 1px var(--ink),1px 0 1px var(--ink),-1px 0 1px var(--ink);white-space:nowrap;text-align:center;user-select:none}
.menu-scene{position:relative;display:grid;place-items:center;isolation:isolate;min-height:100svh}
.menu-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:-1}
.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow)}
.menu-box{width:min(355px,85%);padding:1.3rem;display:grid;gap:.66rem;text-align:center}
.menu-box h1{font-size:1.8rem;margin-bottom:.25rem}
.menu-box button{font-size:1.22rem}
.menu-box .fine{margin-top:.28rem}
.page-top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.95rem}
.lobby{width:min(670px,100%);margin:clamp(0px,7vh,90px) auto}
.room-panel{padding:clamp(18px,3.5vw,36px);display:grid;gap:1rem}
.room-entry form{display:grid;gap:.55rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.room-entry section{border-top:2px solid var(--line);padding-top:.55rem}
.room-code{font-size:1.7rem;letter-spacing:.12em;overflow-wrap:anywhere}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.seat{display:grid;align-content:start;gap:.25rem;border:2px solid var(--line);background:var(--cream);padding:.54rem;min-height:76px;overflow-wrap:anywhere}
.seat.empty{border-style:dashed;background:transparent}
.rules{display:grid;gap:.65rem;max-width:880px;margin:auto}
.rules{max-width:880px}
.rule-video{padding:clamp(.35rem,2vw,.75rem);margin-bottom:1.1rem}
.rule-video video{display:block;width:100%;aspect-ratio:16/9;max-height:65svh;background:#261514}
.video-error{margin-top:.5rem}
.rule-text{padding:clamp(.8rem,4vw,1.75rem);font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:.86rem;line-height:1.75;display:grid;gap:1rem}
.rule-section+.rule-section{border-top:1px solid var(--line);padding-top:1rem}
.rule-section h2{font-size:1.05rem;font-weight:700;margin-bottom:.35rem}
.rule-section p+p{margin-top:.22rem}
.rule-table{width:100%;border-collapse:collapse;margin:.55rem 0 .8rem;font-size:.91em;line-height:1.45}
.rule-table th,.rule-table td{border:1px solid #c99478;padding:.42em .65em;text-align:left;vertical-align:top}
.rule-table thead{background:var(--cream)}
.rule-table tbody th{white-space:nowrap;font-weight:400}
.rule-table tbody tr:nth-child(even){background:#fffdf5}
.rule-swatch{display:inline-block;width:.73em;height:.73em;margin-right:.4em;border:1px solid var(--ink);vertical-align:.025em}
.rule-swatch[data-color="red"]{background:#e45757}
.rule-swatch[data-color="green"]{background:#72c669}
.rule-swatch[data-color="yellow"]{background:#f2ce55}
.rule-swatch[data-color="blue"]{background:#69bde9}
.rule-swatch[data-color="purple"]{background:#b484df}
.board-shell{width:min(1500px,100%);margin:auto;padding:12px clamp(10px,2vw,24px) 25px}
.board-bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;padding:.4rem .6rem;border-bottom:3px solid var(--ink);background:var(--paper)}
.board-bar strong{font-size:1.14rem;font-weight:normal}
.board-bar .row{gap:.4rem}
.board{margin-top:.65rem;display:grid;gap:.65rem;align-items:start;grid-template-columns:minmax(210px,.85fr) minmax(0,2.5fr) minmax(200px,.85fr);grid-template-areas:"decks north east" "decks table east" "decks home east"}
.deck-area{grid-area:decks;padding:.64rem;display:grid;gap:.72rem}
.north{grid-area:north}
.east{grid-area:east;display:grid;gap:.65rem}
.table{grid-area:table;min-height:230px;background:var(--table);padding:.6rem;display:grid;gap:.5rem;align-content:center;text-align:center}
.home{grid-area:home;padding:.62rem;display:grid;gap:.52rem}
.seat-board,.activity{padding:.56rem;display:grid;gap:.48rem}
.seat-board{background:#fff0cd}
.seat-board.active,.home.active{outline:3px solid var(--wine);outline-offset:1px}
.seat-title{display:flex;align-items:center;gap:.5rem;min-width:0}
.seat-title strong{overflow-wrap:anywhere;font-weight:normal}
.chef-mark{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:2px solid var(--ink);font-size:1.33rem}
.mark-0{background:var(--pink)}.mark-1{background:var(--aqua)}.mark-2{background:var(--lav)}
.chef-details{display:grid;gap:.12rem;min-width:0}
.badge{display:inline-flex;background:var(--mint);align-items:center;border:2px solid var(--ink);padding:.1rem .27rem;white-space:nowrap;font-size:.75rem}
.stats{display:flex;gap:.25rem;flex-wrap:wrap}
.decks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem}
.decks figure{margin:0;min-width:0;text-align:center;font-size:.65rem;overflow-wrap:anywhere}
.decks img{width:100%}
.decks figcaption{padding-top:.2rem}
.tags{display:flex;flex-wrap:wrap;gap:.24rem}
.tag{font-size:.67rem;background:#fff7e0;border:1px solid var(--line);padding:.1rem .24rem;white-space:nowrap}
.cards{display:flex;align-items:flex-start;gap:.35rem;flex-wrap:wrap}
.cards.compact{gap:.22rem}
.card{width:clamp(55px,7vw,92px);display:grid;justify-items:center;gap:.14rem;margin:0;min-width:0;text-align:center}
.card img,.market-slot img,.decks img{aspect-ratio:819/1143;object-fit:contain;background:white;border:1px solid var(--line);image-rendering:pixelated}
.card figcaption{font-size:.65rem;line-height:1.12;overflow-wrap:anywhere}
.card-button{display:block;border:0;background:transparent;box-shadow:none;min-height:0;padding:0;width:100%;text-align:center}
.card-button:hover:not(:disabled),.card-button:active:not(:disabled){box-shadow:none;transform:none;background:transparent}
.card-button:hover img{outline:2px solid var(--wine);outline-offset:1px}
.card-art{position:relative;display:block;width:100%;container-type:inline-size}
.card-art img{width:100%;height:auto}
.card-text-fix{position:absolute;left:4.85%;right:4.85%;display:grid;place-items:center;font-size:15.3cqw;line-height:.9;white-space:nowrap;letter-spacing:normal;font-weight:normal;pointer-events:none}
.card-text-fix>span{transform:translateY(-.2em)}
.surf-title{top:6.4%;height:7.7%;background:#ffdda0;color:#5e140c}
.fridge-line,.reverse-line{background:#6ffbff;color:#ffa0f1}
.fridge-line{top:34.8%;height:8.9%}
.reverse-line{top:42.9%;height:7.6%}
.fire-line{top:45.1%;height:8.7%;background:#ffa0f1;color:#6ffbff}
.compact .card{width:clamp(40px,4.2vw,60px)}
.market-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem;width:min(100%,540px);margin:auto;min-height:0;align-items:start}

<body>

  <script type="module">const ingredients = {
  beef: ["Beef", "牛肉"], chicken: ["Chicken", "鸡肉"], pork: ["Pork", "猪肉"],
  cucumber: ["Cucumber", "黄瓜"], tomato: ["Tomato", "番茄"], onion: ["Onion", "洋葱"],
  rice: ["Rice", "米饭"], noodles: ["Noodles", "面条"], bread: ["Bread", "面包"],
  fish: ["Fish", "鱼肉"], shrimp: ["Shrimp", "虾仁"], clam: ["Clam", "花甲"],
  spice: ["Spice", "香料"], soy: ["Soy Sauce", "酱油"], chili: ["Chili", "辣椒"]
}

const levels = ["Level 1", "Level 2", "Level 3"]
const seasonings = ["spice", "soy", "chili"]
const tiers = [
  {
    "chicken-rice": ["Chicken Rice", "鸡肉饭", "chicken rice"],
    "fish-noodles": ["Fish Noodles", "鱼肉面", "fish noodles"],

    "beef-noodles": ["Beef Noodles", "牛肉面", "beef noodles"],
    "beef-onion": ["Beef and Onion", "洋葱炒牛肉", "onion beef"],
    "cucumber-onion": ["Cucumber and Onion", "黄瓜拌洋葱", "cucumber onion"]
  },
  {
    "chicken-salad": ["Cucumber Chicken Salad", "黄瓜鸡肉沙拉", "cucumber chicken spice"],
    "spicy-chicken": ["Spicy Chicken Rice", "香辣鸡肉饭", "chicken rice chili"],
    "seafood-platter": ["Spicy Seafood Platter", "香辣海鲜拼盘", "shrimp clam chili"],
    "soy-shrimp-noodles": ["Soy Sauce Shrimp Noodles", "酱油虾仁面", "shrimp soy noodles"],
    "clam-rice": ["Clam and Onion Fried Rice", "花甲洋葱炒饭", "clam onion rice"],
    "tomato-beef": ["Tomato Beef Rice", "番茄肥牛烩饭", "tomato beef rice"],
    "onion-pork": ["Onion Pork Rice", "洋葱猪肉饭", "onion pork rice"],
    "fish-soup": ["Mediterranean Fish Soup", "地中海鱼汤", "fish tomato spice"]
  },
  {
    "spicy-pork": ["Spicy Pork Sandwich", "香辣猪扒三明治", "pork cucumber bread chili"],
    "seafood-rice": ["Deluxe Seafood Rice", "豪华海鲜饭", "shrimp clam soy rice"],
    "roast-chicken": ["Tomato Roast Chicken Rice", "番茄烤鸡饭", "spice tomato chicken rice"],
    "seafood-soup": ["Tomato Seafood Soup", "番茄海鲜台", "shrimp clam tomato spice"],
    "spicy-beef": ["Extra Spicy Beef Noodles", "爆辣牛肉面", "spice noodles beef chili"],
    "surf-turf": ["Surf and Turf Platter", "海陆拼盘", "beef fish bread soy"],
    "beef-bagel": ["Beef and Onion Bagel", "洋葱牛肉贝果", "bread beef onion spice"],
    "salmon-chicken": ["Salmon and Chicken Rice", "三文鱼鸡肉饭", "fish rice chicken soy"]
  }
]

const recipes = Object.fromEntries(tiers.flatMap((tier, level) =>
  Object.entries(tier).map(([id, [name, file, needed]]) => [
    id, { name, file, level, needed: needed.split(" ") }
  ])
))

const chance = {
  "shopping": ["Shopping Frenzy", "抢购狂潮", "Each successful claim grants one extra ingredient."],
  "lucky": ["Lucky Ingredient", "幸运食材", "Each chef chooses one ingredient from the pantry."],
  "reverse": ["Fate Reversal", "命运逆转", "Each chef may cancel one Fate effect due this round."],
  "chef": ["Chef Descends", "厨神降临", "Each chef may reroll once this round."],
  "blaze": ["Blazing Cook", "烈火烹饪", "Each dish finished this round earns two extra points."],
  "trade": ["Boost Trade", "促进交易", "On their turn this round, each chef can send one free trade offer, even at 0 AP."],
  "fridge": ["Fridge Malfunction", "冰箱故障", "Each chef discards one ingredient of their choice."],
  "outage": ["Power Outage", "厨房停电", "Optional cooking rerolls are disabled this round."],
  "duel": ["Duel Frenzy", "决斗热潮", "The winner of each duel draws an extra Fate card."]
}

const fate = {
  "award": ["Special Award", "特别嘉奖", "Gain two points."],
  "inspiration": ["Flash of Inspiration", "灵光一现", "Draw one random ingredient."],
  "overrun": ["Heat Overrun", "火候失控", "Subtract one from your cooking roll this round."],
  "master": ["Heat Master", "火候大师", "Reroll your first cooking roll this round."],
  "shopping": ["Shopping Frenzy", "抢购狂潮", "Draw one extra ingredient each time you successfully claim."],
  "fumble": ["Fumble", "手滑", "Randomly swap one ingredient with the chef to your left."],
  "chef": ["Chef Descends", "厨神降临", "Each chef may reroll once this round."],
  "fire": ["Kitchen Fire", "厨房失火", "Discard one ingredient of your choice."],
  "overtime": ["Overtime", "加时赛", "Gain one action point for this round."],
  "chaos": ["Fridge Chaos", "冰箱打乱", "Each chef randomly passes one ingredient to the chef on their right."]
}


const rounds = 12
const ingredientLimit = 10
const diceAnimationMs = 1150
const legacyFlipMs = 2000
const marketGraceMs = 3000
const heat = [null, -2, -1, 3, -1, -2]
const heatNames = ["", "Raw", "Undercooked", "Perfect", "Overdone", "Burnt"]
const moves = ["rock", "paper", "scissors"]

function random(max) {
  const range = 2 ** 32
  const limit = range - range % max
  const sample = new Uint32Array(1)
  do { crypto.getRandomValues(sample) } while (sample[0] >= limit)
  return sample[0] % max
}

function shuffle(values) {
  const result = [...values]
  for (let index = result.length - 1; index > 0; index--) {
    const other = random(index + 1)
    ;[result[index], result[other]] = [result[other], result[index]]
  }
  return result
}

function requireGame(condition, message, status = 409) {
  if (!condition) throw Object.assign(new Error(message), { status })
}

function player(name, token) {
  return {
    name, token, score: 0, hand: [], recipes: [], cooked: [], fate: [], activeFate: [],
    ap: 0, extraRoll: 0, roundRoll: 0, penalty: 0, trade: false,
    discard: 0, lucky: false, cancel: false
  }
}

function room(code, host) {
  return { code, phase: "lobby", players: [host], round: 0, feed: [], pending: null }
}

function log(state, text, sound = "", bonus) {
  const id = (state.feed.at(-1)?.id ?? 0) + 1
  state.feed.push({ id, text, sound, bonus })
  state.feed = state.feed.slice(-18)
}

function drawIngredient(state, chosen) {
  if (!state.pantry.length) {
    state.pantry = shuffle(state.scraps)
    state.scraps = []
  }
  if (chosen) {
    const index = state.pantry.indexOf(chosen)
    if (index !== -1) return state.pantry.splice(index, 1)[0]
    return null
  }
  return state.pantry.pop() ?? null
}

function giveRandom(state, recipient) {
  const card = drawIngredient(state)
  if (card) recipient.hand.push(card)
  return !!card
}

function recordBonus(state, seat, source, cards) {
  if (!cards.length) return
  const names = cards.map(card => ingredients[card][0]).join(", ")
  log(state, state.players[seat].name + " received a bonus from " + source + ": " + names + ".",
    "", { seat, source, cards })
}

function awardRandomBonus(state, seat, source, count = 1) {
  const chef = state.players[seat]
  const cards = []
  for (let index = 0; index < count; index++) {
    const card = drawIngredient(state)
    if (!card) break
    chef.hand.push(card)
    cards.push(card)
  }
  recordBonus(state, seat, source, cards)
}

function take(player, card) {
  const index = player.hand.indexOf(card)
  requireGame(index !== -1, "That ingredient is no longer available.")
  return player.hand.splice(index, 1)[0]
}

function ingredientCount(hand, card) {
  return hand.filter(ingredient => ingredient === card).length
}

function takeRandom(player) {
  return player.hand.length ? player.hand.splice(random(player.hand.length), 1)[0] : null
}

function dealFate(state, chef) {
  if (!state.fateDeck.length) {
    state.fateDeck = shuffle(state.fateDiscard)
    state.fateDiscard = []
  }
  const effect = state.fateDeck.pop()
  if (effect) chef.fate.push(effect)
}

function start(state, now) {
  state.pantry = shuffle(Object.keys(ingredients).flatMap(card => Array(5).fill(card)))
  state.scraps = []
  state.recipeDecks = [[], [], []]
  addRecipeCopies(state)
  state.chanceDeck = shuffle(Object.keys(chance))
  state.chanceDiscard = []
  state.fateDeck = shuffle(Object.keys(fate))
  state.fateDiscard = []
  for (const chef of state.players) chef.recipes.push(state.recipeDecks[0].pop(), state.recipeDecks[0].pop())
  nextRound(state, now)
}

function addRecipeCopies(state) {
  const ids = Object.keys(recipes)
  const copies = state.phase === "lobby" ? 2 : 1
  state.recipeDecks = state.recipeDecks.map((deck, level) => shuffle([
    ...deck, ...ids.filter(id => recipes[id].level === level).flatMap(id => Array(copies).fill(id))
  ]))
  state.recipeCopies = 2
}

function drawRoundChance(state) {
  const previous = state.chance
  if (previous) state.chanceDiscard.push(previous)
  if (!state.chanceDeck.length) {
    state.chanceDeck = shuffle(state.chanceDiscard)
    state.chanceDiscard = []
  }
  const last = state.chanceDeck.length - 1
  if (state.chanceDeck[last] === previous) {
    const alternative = state.chanceDeck.findIndex(card => card !== previous)
    if (alternative !== -1) [state.chanceDeck[last], state.chanceDeck[alternative]] =
      [state.chanceDeck[alternative], state.chanceDeck[last]]
  }
  return state.chanceDeck.pop()
}

function nextRound(state, now) {
  if (state.round === rounds) {
    state.phase = "finished"
    state.ranking = state.players.map((chef, seat) => ({ seat, score: chef.score }))
      .sort((left, right) => right.score - left.score).map(entry => entry.seat)
    log(state, "The feast is complete.")
    return
  }
  state.round++
  state.turn = 0
  state.turns = 0
  state.market = []
  state.marketTaken = []
  state.marketClaims = []
  state.flipTimes = []
  state.claim = null
  state.revealAt = null
  state.marketClosesAt = null
  state.marketPausedAt = null
  state.tradeOffer = null
  state.chance = drawRoundChance(state)
  state.marketBonus = Number(state.chance === "shopping")
  state.phase = "fate-choice"
  for (const chef of state.players) {
    chef.activeFate = chef.fate.splice(0)
    chef.ap = 2
    chef.roundRoll = Number(state.chance === "chef")
    chef.trade = state.chance === "trade"
    chef.discard = 0
    chef.lucky = state.chance === "lucky"
    chef.cancel = state.chance === "reverse" && chef.activeFate.length > 0
    chef.heatPenalty = 0
    chef.forcedRoll = 0
    chef.marketBonus = 0
  }
  log(state, "Round " + state.round + " - " + chance[state.chance][0] + ".")
  if (!state.players.some(chef => chef.cancel)) settleFate(state, now)
}

function settleFate(state, now) {
  state.phase = "prep"
  for (const [seat, chef] of state.players.entries()) {
    for (const effect of chef.activeFate) {
      switch (effect) {
        case "award": chef.score += 2; break
        case "inspiration": awardRandomBonus(state, seat, "Fate / " + fate.inspiration[0]); break
        case "overrun": chef.heatPenalty++; break
        case "master": chef.forcedRoll++; break
        case "shopping": chef.marketBonus++; break
        case "fumble": {
          const left = state.players[(seat + 1) % 3]
          if (chef.hand.length && left.hand.length) {
            const own = takeRandom(chef)
            chef.hand.push(takeRandom(left))
            left.hand.push(own)
          }
          break
        }
        case "chef": for (const other of state.players) other.roundRoll++; break
        case "fire": chef.discard++; break
        case "overtime": chef.ap++; break
        case "chaos": {
          const passed = state.players.map(takeRandom)
          for (const [index, card] of passed.entries()) {
            if (card) state.players[(index + 2) % 3].hand.push(card)
          }
          break
        }
      }
      state.fateDiscard.push(effect)
    }
  }
  if (state.chance === "fridge") for (const chef of state.players) chef.discard++
  checkPrep(state, now)
}

function checkPrep(state, now) {
  for (const chef of state.players) {
    chef.discard = Math.min(chef.discard, chef.hand.length)
    if (!state.pantry.length && !state.scraps.length) chef.lucky = false
  }
  if (state.players.some(chef => chef.discard || chef.lucky)) return
  for (let index = 0; index < 5; index++) {
    const card = drawIngredient(state)
    if (card) state.market.push(card)
  }
  state.turn = 0
  state.phase = state.market.length ? "market" : "action"
  let flipTime = now + 1600 + random(1401)
  state.flipTimes = state.market.map((_, index) => {
    if (index) flipTime += 1100 + random(2101)
    return flipTime
  })
  state.revealAt = state.flipTimes[0] ?? null
}

function flipTimes(state) {
  return state.flipTimes?.length ? state.flipTimes :
    state.market.map((_, index) => state.revealAt + index * legacyFlipMs)
}

function revealed(state, now) {
  if (state.phase !== "market") return 0
  const marketTime = state.marketPausedAt == null ? now : state.marketPausedAt
  return flipTimes(state).filter(time => time <= marketTime).length
}

function marketDeadline(state) {
  return state.marketClosesAt ?? Infinity
}

function excessIngredients(chef) {
  return Math.max(0, chef.hand.length - ingredientLimit)
}

function waitingForDiscards(state) {
  return state.phase !== "finished" && state.players.some(chef => excessIngredients(chef) > 0)
}

function syncMarketPause(state, now, waiting = waitingForDiscards(state)) {
  if (state.phase !== "market") return false
  const pausedAt = state.marketPausedAt
  if (waiting && pausedAt == null) {
    state.marketPausedAt = now
    return true
  }
  if (waiting || pausedAt == null) return false
  const duration = Math.max(0, now - pausedAt)
  if (state.marketClosesAt != null) state.marketClosesAt += duration
  state.flipTimes = flipTimes(state).map(time => time > pausedAt ? time + duration : time)
  state.marketPausedAt = null
  return true
}

function finishMarket(state) {
  const remaining = state.market.filter((_, index) => state.marketTaken?.[index] == null)
  if (remaining.length) {
    state.pantry = remaining.concat(state.pantry)
    log(state, "Market closed. " + remaining.length + " unclaimed " + (remaining.length === 1 ? "card returned" : "cards returned") + " to the bottom of the pantry.")
  }
  state.market = []
  state.turn = 0
  state.phase = "action"
}

function claimable(state, now) {
  const count = revealed(state, now)
  return state.market.flatMap((_, index) => index < count && state.marketTaken?.[index] == null ? [index] : [])
}

function ringMarket(state, seat, now) {
  const chef = state.players[seat]
  const slots = claimable(state, now)
  requireGame(slots.length, "There are no revealed, unclaimed ingredients yet.")
  state.marketTaken ??= Array(state.market.length).fill(null)
  state.marketClaims ??= []
  for (const index of slots) {
    chef.hand.push(state.market[index])
    state.marketTaken[index] = seat
  }
  state.claim = { name: chef.name, count: slots.length }
  state.marketClaims.push(state.claim)
  log(state, chef.name + " rang the bell and claimed " + slots.length + ".", "bell")
  if (state.marketBonus) awardRandomBonus(state, seat, "Chance / " + chance.shopping[0], state.marketBonus)
  if (chef.marketBonus) awardRandomBonus(state, seat, "Fate / " + fate.shopping[0], chef.marketBonus)
  if (state.market.every((_, index) => state.marketTaken[index] != null)) finishMarket(state)
}

function advanceClock(state, now) {
  const needsCopies = state.recipeDecks && state.recipeCopies !== 2
  if (needsCopies) addRecipeCopies(state)
  const waiting = waitingForDiscards(state)
  const pauseChanged = syncMarketPause(state, now, waiting)
  if (!waiting && state.phase === "market") {
    if (state.marketClosesAt == null && now >= flipTimes(state).at(-1)) {
      state.marketClosesAt = now + marketGraceMs
      return true
    }
    if (now >= marketDeadline(state)) {
      finishMarket(state)
      return true
    }
  }
  if (!waiting && state.pending?.kind === "cook" && state.pending.motion?.showAt <= now) {
    settleDiceRoll(state)
    return true
  }
  return !!needsCopies || pauseChanged
}

function unlock(chef) {
  if (chef.cooked.some(dish => recipes[dish.recipe].level === 1)) return 2
  return chef.cooked.filter(dish => recipes[dish.recipe].level === 0).length >= 2 ? 1 : 0
}

function hasIngredients(chef, needed) {
  const remaining = [...chef.hand]
  return needed.every(card => {
    const index = remaining.indexOf(card)
    if (index === -1) return false
    remaining.splice(index, 1)
    return true
  })
}

function beginDiceRoll(cook, reason, now) {
  if (reason !== "six") cook.rolls.push([])
  cook.rollReason = null
  cook.motion = { face: random(6) + 1, showAt: now + diceAnimationMs }
}

function settleDiceRoll(state) {
  const cook = state.pending
  const chef = state.players[cook.seat]
  const face = cook.motion.face
  cook.motion = null
  cook.rolls.at(-1).push(face)
  if (face === 6) cook.rollReason = "six"
  else if (!cook.optional && !cook.fateRerolled && state.chance !== "outage" && chef.forcedRoll) {
    chef.forcedRoll--
    cook.fateRerolled = true
    cook.rollReason = "fate"
  }
}

function cookingHeat(chef, cook) {
  const die = cook.rolls.at(-1)?.at(-1)
  if (!die || die === 6 || cook.rollReason || cook.motion) return null
  const adjusted = Math.max(1, die - (chef.heatPenalty ?? 0))
  return { adjusted, heatScore: heat[adjusted], heatName: heatNames[adjusted] }
}

function finishCook(state, chef) {
  const cook = state.pending
  const { recipe, extra, rolls } = cook
  const result = cookingHeat(chef, cook)
  requireGame(result, "Finish rolling the cooking dice before plating.")
  const { heatScore, heatName } = result
  const blaze = state.chance === "blaze" ? 2 : 0
  const score = recipes[recipe].needed.length + heatScore + Number(!!extra) + blaze - chef.penalty
  chef.cooked.push({ recipe, extra, rolls, heatScore, heat: heatName, score, blaze, penalty: chef.penalty })
  chef.score += score
  chef.penalty = 0
  if (cook.stoveRoll == null) chef.extraRoll = 0
  dealFate(state, chef)
  log(state, chef.name + " cooked " + recipes[recipe].name + " (" + (score >= 0 ? "+" : "") + score + ").", "click")
  state.pending = null
}

function handleCook(state, seat, action, now) {
  const chef = state.players[seat]
  const cook = state.pending
  requireGame(cook.seat === seat, "The active chef is cooking.")
  requireGame(!cook.motion, "The dice are still rolling.")
  if (action.type === "roll-dice") {
    requireGame(cook.rollReason, "The roll is complete. Plate the dish or choose an available reroll.")
    beginDiceRoll(cook, cook.rollReason, now)
  } else if (action.type === "reroll") {
    const stoveRoll = cook.stoveRoll ?? chef.extraRoll > 0
    requireGame(cookingHeat(chef, cook) && state.chance !== "outage" && (stoveRoll || chef.roundRoll > 0) &&
      !cook.optional, "No optional reroll is available.")
    if (stoveRoll) {
      cook.stoveRoll = false
      chef.extraRoll = 0
    } else chef.roundRoll--
    cook.optional = true
    beginDiceRoll(cook, "optional", now)
  } else {
    requireGame(action.type === "plate", "Plate the dish or reroll first.")
    finishCook(state, chef)
  }
}

function handleDuel(state, seat, action) {
  const duel = state.pending
  const chef = state.players[seat]
  if (duel.stage === "invite") {
    requireGame(seat === duel.target && action.type === "duel-answer", "The challenged chef must answer.")
    if (action.accept) {
      duel.stage = "play"
    } else {
      requireGame(chef.hand.length, "You need an ingredient to decline the duel.")
      const card = takeRandom(chef)
      state.players[duel.seat].hand.push(card)
      log(state, chef.name + " declined the duel and handed over " + ingredients[card][0] + ".")
      recordBonus(state, duel.seat, "Duel / Declined", [card])
      state.pending = null
    }
    return
  }
  if (duel.stage === "reward") {
    requireGame(seat === duel.winner && action.type === "duel-reward", "The duel winner must choose a reward.")
    const loser = state.players[duel.loser]
    const lost = []
    if (action.reward === "steal") {
      chef.hand.push(take(loser, action.card))
      lost.push(action.card)
    }
    else if (action.reward === "reroll") chef.extraRoll = 1
    else if (action.reward === "taunt") loser.penalty++
    else requireGame(false, "Choose a duel reward.")
    for (let index = 0; index < 2; index++) {
      const card = takeRandom(loser)
      if (card) {
        state.scraps.push(card)
        lost.push(card)
      }
    }
    if (state.chance === "duel") dealFate(state, chef)
    log(state, chef.name + " won the duel and chose " + { steal: "Steal a Bite", reroll: "Claim the Stove", taunt: "Culinary Taunt" }[action.reward] + ".")
    if (action.reward === "steal") recordBonus(state, seat, "Duel / Steal a Bite", [action.card])
    if (lost.length) log(state, loser.name + " lost " + lost.map(card => ingredients[card][0]).join(", ") + " in the duel.")
    state.lastDuel = { seat: duel.seat, target: duel.target, wins: duel.wins, history: duel.history, winner: duel.winner }
    state.pending = null
    return
  }
  if (duel.stage === "reveal") {
    requireGame((seat === duel.seat || seat === duel.target) && action.type === "duel-next", "Both duelists must review this throw.")
    requireGame(!duel.reviewed.includes(seat), "You are already ready.")
    duel.reviewed.push(seat)
    if (duel.reviewed.length === 2) duel.stage = "play"
    return
  }
  requireGame((seat === duel.seat || seat === duel.target) && action.type === "duel-move", "Only the two duelists can play.")
  requireGame(moves.includes(action.move) && !duel.throws[seat], "Choose one move per throw.")
  duel.throws[seat] = action.move
  const first = duel.throws[duel.seat]
  const second = duel.throws[duel.target]
  if (!first || !second) return
  duel.throws = {}
  const winner = first === second ? null : (moves.indexOf(first) - moves.indexOf(second) + 3) % 3 === 1 ? duel.seat : duel.target
  if (winner !== null) duel.wins[winner]++
  duel.history.push({ first, second, winner })
  if (winner !== null && duel.wins[winner] === 2) {
    duel.winner = winner
    duel.loser = winner === duel.seat ? duel.target : duel.seat
    duel.stage = "reward"
  } else {
    duel.stage = "reveal"
    duel.reviewed = []
  }
}

function handleTrade(state, seat, action) {
  const trade = state.tradeOffer ?? state.pending
  const withdraw = action.type === "trade-withdraw" && seat === trade.seat
  requireGame(withdraw || (seat === trade.target && action.type === "trade-answer"), "The other chef must answer the trade offer.")
  if (withdraw) {
    log(state, state.players[seat].name + " withdrew the trade offer.")
  } else if (action.accept) {
    const proposer = state.players[trade.seat]
    const receiver = state.players[seat]
    const giveCount = trade.giveCount ?? 1
    const wantCount = trade.wantCount ?? 1
    requireGame(ingredientCount(proposer.hand, trade.give) >= giveCount && ingredientCount(receiver.hand, trade.want) >= wantCount,
      "Both offered quantities must still be available.")
    const givenCards = Array.from({ length: giveCount }, () => take(proposer, trade.give))
    const receivedCards = Array.from({ length: wantCount }, () => take(receiver, trade.want))
    receiver.hand.push(...givenCards)
    proposer.hand.push(...receivedCards)
    log(state, proposer.name + " traded with " + receiver.name + ".")
  } else log(state, state.players[seat].name + " declined the trade.")
  if (state.tradeOffer) state.tradeOffer = null
  else state.pending = null
}

function hasFreeTrade(state, chef) {
  return state.chance === "trade" && chef.trade
}

function startTrade(state, seat, action) {
  const chef = state.players[seat]
  const target = state.players[action.target]
  const freeTrade = hasFreeTrade(state, chef)
  requireGame(Number.isInteger(action.target) && target && action.target !== seat, "Choose another chef.")
  requireGame(freeTrade || chef.ap > 0, "You need an action point or a free trade.")
  const { give, want, giveCount = 1, wantCount = 1 } = action
  requireGame(Number.isInteger(giveCount) && giveCount > 0 && Number.isInteger(wantCount) && wantCount > 0,
    "Choose a positive whole quantity for each ingredient.")
  requireGame(ingredientCount(chef.hand, give) >= giveCount && ingredientCount(target.hand, want) >= wantCount,
    "Both offered quantities must be available.")
  const cost = freeTrade ? 0 : 1
  if (cost) chef.ap--
  else chef.trade = false
  state.tradeOffer = { kind: "trade", seat, target: action.target, give, giveCount, want, wantCount, cost }
  log(state, chef.name + " offered a trade to " + target.name + (cost ? " for 1 AP." : " for free."))
}

function perform(state, seat, action, now) {
  const chef = state.players[seat]
  requireGame(chef, "You do not have a seat in this room.", 403)
  if (waitingForDiscards(state) || (action.type === "discard-overflow" && state.phase !== "finished")) {
    const excess = excessIngredients(chef)
    requireGame(action.type === "discard-overflow" && excess, "Wait for the ingredient hand limit discards.")
    const { cards } = action
    requireGame(Array.isArray(cards) && cards.length === excess && hasIngredients(chef, cards),
      "Choose exactly " + excess + " cards from your hand.")
    state.scraps.push(...cards.map(card => take(chef, card)))
    log(state, chef.name + " discarded " + cards.map(card => ingredients[card][0]).join(", ") + " to keep " + ingredientLimit + " ingredients.")
  } else {
    performAction(state, seat, action, now)
  }
  syncMarketPause(state, now)
}

function performAction(state, seat, action, now) {
  const chef = state.players[seat]
  if (state.phase === "lobby") {
    requireGame(action.type === "start" && seat === 0 && state.players.length === 3, "The host can start when all three seats are filled.")
    start(state, now)
    return
  }
  if (state.phase === "fate-choice") {
    requireGame(action.type === "cancel" && chef.cancel, "Waiting for Fate choices.")
    if (action.index !== null) {
      requireGame(Number.isInteger(action.index) && !!chef.activeFate[action.index], "Choose a Fate card to cancel.")
      state.fateDiscard.push(chef.activeFate.splice(action.index, 1)[0])
    }
    chef.cancel = false
    if (!state.players.some(member => member.cancel)) settleFate(state, now)
    return
  }
  if (state.phase === "prep") {
    if (action.type === "discard" && chef.discard) {
      state.scraps.push(take(chef, action.card))
      chef.discard--
    } else {
      requireGame(action.type === "lucky" && chef.lucky, "Waiting for ingredient choices.")
      const card = drawIngredient(state, action.card)
      requireGame(card && action.card, "Choose an available ingredient.")
      chef.hand.push(card)
      chef.lucky = false
      recordBonus(state, seat, "Chance / " + chance.lucky[0], [card])
    }
    checkPrep(state, now)
    return
  }
  if (state.phase === "market") {
    requireGame(action.type === "ring", "The ingredient market is open.")
    requireGame(action.round === state.round && now < marketDeadline(state), "This market has closed.")
    ringMarket(state, seat, now)
    return
  }
  requireGame(action.type !== "ring", "This market has closed.")
  requireGame(state.phase === "action", "The match is over.")
  if (state.tradeOffer || state.pending?.kind === "trade") return handleTrade(state, seat, action)
  if (state.pending?.kind === "cook") return handleCook(state, seat, action, now)
  if (state.pending?.kind === "duel") return handleDuel(state, seat, action)
  requireGame(state.turn === seat, "It is another chef's turn.")
  if (action.type === "trade") return startTrade(state, seat, action)
  if (action.type === "end") {
    chef.ap = 0
    chef.trade = false
    state.turns++
    if (state.turns === 3) nextRound(state, now)
    else state.turn = (state.turn + 1) % 3
    return
  }
  requireGame(chef.ap > 0, "You are out of action points.")
  switch (action.type) {
    case "draw-ingredient":
      requireGame(giveRandom(state, chef), "The pantry is empty.")
      log(state, chef.name + " drew " + ingredients[chef.hand.at(-1)][0] + ".", "click")
      break
    case "draw-recipe": {
      const level = action.level
      requireGame(Number.isInteger(level) && level >= 0 && level <= unlock(chef), "That recipe tier is locked.")
      requireGame(state.recipeDecks[level].length, "That recipe deck is empty.")
      chef.recipes.push(state.recipeDecks[level].pop())
      log(state, chef.name + " drew a recipe.", "click")
      break
    }
    case "cook": {
      requireGame(chef.recipes.includes(action.recipe), "Choose one of your recipes.")
      const needed = [...recipes[action.recipe].needed]
      const extra = action.extra || null
      requireGame(!extra || seasonings.includes(extra), "Choose a purple seasoning.")
      if (extra) needed.push(extra)
      requireGame(hasIngredients(chef, needed), "You are missing an ingredient.")
      for (const card of needed) state.scraps.push(take(chef, card))
      chef.recipes.splice(chef.recipes.indexOf(action.recipe), 1)
      state.pending = { kind: "cook", seat, recipe: action.recipe, extra, rolls: [], optional: false,
        rollReason: "first", stoveRoll: chef.extraRoll > 0 }
      chef.extraRoll = 0
      break
    }
    case "duel": {
      requireGame(Number.isInteger(action.target) && state.players[action.target] && action.target !== seat, "Choose another chef.")
      state.scraps.push(take(chef, action.card))
      dealFate(state, chef)
      state.pending = {
        kind: "duel", stage: "invite", seat, target: action.target, throws: {},
        wins: { [seat]: 0, [action.target]: 0 }, history: []
      }
      log(state, chef.name + " paid " + ingredients[action.card][0] + " to challenge " + state.players[action.target].name + ".")
      break
    }
    default: requireGame(false, "Unknown action.", 400)
  }
  chef.ap--
}

function publicView(state, seat, now) {
  const chef = state.players[seat]
  const count = revealed(state, now)
  const { pending } = state
  const mayAct = state.phase === "action" && state.turn === seat && !pending && !state.tradeOffer && !waitingForDiscards(state)
  const freeTrade = !!(mayAct && hasFreeTrade(state, chef))
  let visiblePending = pending
  if (pending?.kind === "duel") {
    visiblePending = { ...pending, throws: Object.fromEntries(Object.keys(pending.throws).map(key => [key, true])) }
  } else if (pending?.kind === "cook") {
    const cook = state.players[pending.seat]
    const { motion, ...visible } = pending
    visiblePending = { ...visible, rolling: !!motion, heatResult: cookingHeat(cook, pending) }
  }
  return {
    code: state.code, phase: state.phase, round: state.round, maxRounds: rounds,
    seat, turn: state.turn, chance: state.chance, claim: state.claim, ranking: state.ranking, lastDuel: state.lastDuel,
    marketClaims: state.marketClaims ?? (state.claim ? [state.claim] : []),
    pending: visiblePending, tradeOffer: state.tradeOffer, feed: state.feed, serverTime: now,
    market: (state.market ?? []).map((card, index) => index < count ? card : null),
    marketTaken: (state.market ?? []).map((_, index) => state.marketTaken?.[index] ?? null),
    marketClosesAt: state.phase === "market" && count === state.market.length && state.marketPausedAt == null ?
      state.marketClosesAt ?? null : null,
    canRing: state.phase === "market" && !waitingForDiscards(state) && claimable(state, now).length > 0,
    ingredientLimit,
    overflow: state.players.map(chef => state.phase === "finished" ? 0 : excessIngredients(chef)),
    decks: state.recipeDecks?.map(deck => deck.length) ?? [0, 0, 0],
    pantryCount: (state.pantry?.length ?? 0) + (state.scraps?.length ?? 0),
    pantryChoices: chef.lucky ? [...new Set(state.pantry.length ? state.pantry : state.scraps)] : [],
    players: state.players.map((member, index) => ({
      name: member.name, hand: member.hand, score: member.score, ap: member.ap,
      recipeCount: member.recipes.length, cooked: member.cooked,
      recipeBacks: [0, 1, 2].map(level => member.recipes.filter(key => recipes[key].level === level).length),
      recipes: index === seat ? member.recipes : undefined
    })),
    own: {
      fate: chef.fate, activeFate: chef.activeFate, cancel: chef.cancel, discard: chef.discard,
      lucky: chef.lucky, unlock: unlock(chef), canTrade: mayAct && (freeTrade || chef.ap > 0), freeTrade,
      reroll: ((chef.roundRoll ?? 0) > 0 || (pending?.kind === "cook" && pending.seat === seat ?
        pending.stoveRoll ?? chef.extraRoll > 0 : chef.extraRoll > 0)) && state.chance !== "outage",
      heatPenalty: chef.heatPenalty ?? 0
    }
  }
